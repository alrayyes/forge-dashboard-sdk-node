# Builds the API reference from TSDoc comments and the test and coverage
# reports, and publishes both to GitHub Pages (the reports under /reports/).
# Separate from ci.yml's own jobs since this deploys something (a live
# site), not just checks a diff.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pull requests get a group per ref, so they never queue behind (or cancel)
# the deploy in the shared `pages` group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # Tests first: a red run fails this job, so deploy never starts and
      # nothing is published (reports included).
      - name: Run the tests with coverage
        run: bun run test:ci
      - run: bun run docs
      # typedoc (0.28.20) has no option to copy an arbitrary static file
      # into its output directory -- `projectDocuments` is the closest
      # built-in, but it renders a given markdown file as an HTML page
      # inside the theme rather than serving it verbatim, which is exactly
      # what llmstxt.org's /llms.txt needs. Copying it in after the build
      # is the plain alternative.
      - name: Copy llms.txt into the built site
        run: cp llms.txt site/llms.txt
      # One Pages deployment per repo, so the reports ship in the same
      # artifact as the API reference, under site/reports/.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the coverage converters
        run: |
          pip install lcov_cobertura==2.1.1
          sudo apt-get install -y --no-install-recommends lcov
      - name: Assemble the test and coverage reports
        run: ./hack/assemble-reports.sh site/reports
      # Build and assemble everywhere so a broken step fails before the
      # merge; only a push to main uploads and deploys.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Live coverage.xml is served and is Cobertura
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --output coverage.xml "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
